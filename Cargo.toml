[package]
name = "agentbox"
version = "0.1.0"
edition = "2021"
description = "Cross-agent local blackbox: record every step, snapshot filesystem including bash changes, and undo any step."
license = "MIT"

[[bin]]
name = "abox"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
fs2 = "0.4"
globset = "0.4"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

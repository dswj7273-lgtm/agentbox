# Example GitHub Action: Post AgentBox cost & audit summary on Pull Requests
# Copy into your repository's `.github/workflows/` if you check in or sync `.agentbox` logs in CI.
name: AgentBox PR Audit Comment

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  agentbox-comment:
    if: hashFiles('.agentbox/audit.md') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comment PR with AgentBox summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.agentbox/audit.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
